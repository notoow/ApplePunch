name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript
        run: node --check app.js
      - name: Prepare site
        run: |
          mkdir -p _site/assets
          cp index.html product.html styles.css app.js _site/
          cp assets/brand-logo.png assets/real-apple-box.webp assets/apple-table-hero.png assets/apple-products.png assets/PretendardVariable.woff2 assets/Pretendard-LICENSE.txt _site/assets/
          cp -r assets/cultivars _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
